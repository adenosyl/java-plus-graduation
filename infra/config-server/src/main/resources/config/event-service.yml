server:
  port: 9093

spring:
  cloud:
    openfeign:
      okhttp:
        enabled: true

  datasource:
    url: jdbc:h2:mem:eventdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

grpc:
  client:
    analyzer:
      address: static://localhost:9097
      negotiationType: plaintext

    collector:
      address: static://localhost:9090
      negotiationType: plaintext