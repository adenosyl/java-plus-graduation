server:
  port: 8080

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      mvc:
        routes:

          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/admin/users/**

          - id: request-service
            uri: lb://REQUEST-SERVICE
            predicates:
              - Path=/users/*/requests/**

          - id: event-service-private
            uri: lb://EVENT-SERVICE
            predicates:
              - Path=/users/*/events/**

          - id: event-service-public
            uri: lb://EVENT-SERVICE
            predicates:
              - Path=/events/**

          - id: event-service-admin
            uri: lb://EVENT-SERVICE
            predicates:
              - Path=/admin/events/**,/admin/categories/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka