server:
  port: 8080

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      mvc:
        routes:
          - id: ewm-main-service
            uri: lb://EWM-MAIN-SERVICE
            predicates:
              - Path=/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka