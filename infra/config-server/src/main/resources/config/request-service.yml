server:
  port: 9094

spring:
  datasource:
    url: jdbc:h2:mem:requestdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

grpc:
  client:
    collector:
      address: static://localhost:9090
      negotiationType: plaintext